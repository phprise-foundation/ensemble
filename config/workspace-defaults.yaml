workflows:
  - key: epic-workflow
    name: Epic Workflow
    issue_types:
      - key: epic
        name: Epic
        level: 0
    statuses:
      - key: conceptualizing
        name: Conceptualizing
        type: initial
        roles: []
        description: Initial state; only the user moves it.
      - key: discovering
        name: Discovering
        type: transitional
        roles: [product-owner]
        description: Discover the problem, understand the pain and question the user until there are no doubts.
      - key: designing
        name: Designing
        type: transitional
        roles: [solutions-architect]
        description: Develop the solution proposal.
      - key: assessing
        name: Assessing
        type: transitional
        roles: [systems-architect]
        description: Assess feasibility.
      - key: rejected
        name: Rejected
        type: transitional
        roles: [solutions-architect]
        description: The solution proposal was rejected.
      - key: approved
        name: Approved
        type: transitional
        roles: [product-owner]
        description: The solution proposal was approved.
      - key: ready
        name: Ready
        type: final
        roles: []
        description: Ready for downstream.
      - key: canceled
        name: Canceled
        type: final
        roles: []
    transitions:
      - name: cancel
        from: any
        to: canceled
        actor: user
      - name: discover
        from: conceptualizing
        to: discovering
        actor: system
      - name: design
        from: discovering
        to: designing
        actor: system
      - name: assess
        from: designing
        to: assessing
        actor: system
      - name: reject
        from: assessing
        to: rejected
        actor: system
      - name: approve
        from: assessing
        to: approved
        actor: system
      - name: retry
        from: rejected
        to: designing
        actor: user
      - name: finish
        from: approved
        to: ready
        actor: system

  - key: story-workflow
    name: Story Workflow
    issue_types:
      - key: story
        name: Story
        level: 1
      - key: bug
        name: Bug
        level: 1
    statuses:
      - key: prioritizing
        name: Prioritizing
        type: initial
        roles: [product-owner]
        description: Prioritize based on RICE.
      - key: evaluating
        name: Evaluating
        type: transitional
        roles: [technical-architect]
        description: Define stacks and tools and break the story into atomic subtasks.
      - key: developing
        name: Developing
        type: transitional
        roles: []
        description: Waiting for subtasks to be ready and merged.
      - key: testing
        name: Testing
        type: transitional
        roles: [quality-assurance]
        description: Test and create a fix subtask when there are problems.
      - key: deploying
        name: Deploying
        type: transitional
        roles: [tech-lead]
        description: Deploy to production.
      - key: verifying
        name: Verifying
        type: transitional
        roles: [quality-assurance]
        description: Run functional, regression and post-deploy smoke tests.
      - key: reverting
        name: Reverting
        type: transitional
        roles: [tech-lead]
        description: Roll back the deployment.
      - key: reverted
        name: Reverted
        type: transitional
        roles: []
        description: Reverted, waiting for a manual user retry.
      - key: hotfixing
        name: Hotfixing
        type: transitional
        roles: [tech-lead]
        description: Apply a hotfix to a reverted deployment.
      - key: implemented
        name: Implemented
        type: final
        roles: []
        description: Everything is ready and validated in production.
      - key: canceled
        name: Canceled
        type: final
        roles: []
    transitions:
      - name: cancel
        from: any
        to: canceled
        actor: user
      - name: evaluate
        from: prioritizing
        to: evaluating
        actor: system
      - name: develop
        from: evaluating
        to: developing
        actor: system
      - name: test
        from: developing
        to: testing
        actor: system
      - name: deploy
        from: testing
        to: deploying
        actor: system
      - name: verify
        from: deploying
        to: verifying
        actor: system
      - name: revert
        from: verifying
        to: reverting
        actor: system
      - name: reverted
        from: reverting
        to: reverted
        actor: system
      - name: hotfix
        from: reverted
        to: hotfixing
        actor: user
      - name: redeploy
        from: hotfixing
        to: deploying
        actor: system
      - name: close
        from: verifying
        to: implemented
        actor: system

  - key: subtask-workflow
    name: Subtask Workflow
    issue_types:
      - key: feat
        name: Feat
        level: 2
      - key: fix
        name: Fix
        level: 2
      - key: hotfix
        name: Hotfix
        level: 2
    statuses:
      - key: coding
        name: Coding
        type: initial
        roles: [coder]
        description: Writing code.
      - key: reviewing
        name: Reviewing
        type: transitional
        roles: [coder, tech-lead]
        description: Reviewing code.
      - key: fixing
        name: Fixing
        type: transitional
        roles: [coder]
        description: Fixing code.
      - key: merged
        name: Merged
        type: final
        roles: []
        description: Merged and ready.
      - key: canceled
        name: Canceled
        type: final
        roles: []
    transitions:
      - name: cancel
        from: any
        to: canceled
        actor: user
      - name: review
        from: coding
        to: reviewing
        actor: system
      - name: fix
        from: reviewing
        to: fixing
        actor: system
      - name: fixed
        from: fixing
        to: reviewing
        actor: system
      - name: merge
        from: reviewing
        to: merged
        actor: system

boards:
  - key: upstream
    name: Upstream
    workflow: epic-workflow
    issue_level: 0
    columns:
      - name: Discovery
        statuses: [discovering]
      - name: Design
        statuses: [designing, assessing, rejected, approved]
      - name: Replenishment
        statuses: [ready]
    backlog_statuses: [conceptualizing, canceled]
  - key: downstream
    name: Downstream
    workflow: story-workflow
    issue_level: 1
    columns:
      - name: Refinement
        statuses: [evaluating]
      - name: Development
        statuses: [developing, testing]
      - name: Publish
        statuses: [deploying, verifying, reverting, reverted, hotfixing]
      - name: Production
        statuses: [implemented]
    backlog_statuses: [prioritizing, canceled]
