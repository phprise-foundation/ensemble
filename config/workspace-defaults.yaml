workflows:
  -
    key: epic-workflow
    name: 'Epic Workflow'
    issue_types:
      -
        key: epic
        name: Epic
        level: 0
    statuses:
      -
        key: conceptualizing
        name: Conceptualizing
        type: initial
        roles: {}
        description: 'Initial state; only the user moves it.'
      -
        key: discovering
        name: Discovering
        type: transitional
        roles:
          - product-owner
        description: 'Discover the problem, understand the pain and question the user until there are no doubts.'
      -
        key: designing
        name: Designing
        type: transitional
        roles:
          - solutions-architect
        description: 'Develop the solution proposal.'
      -
        key: assessing
        name: Assessing
        type: transitional
        roles:
          - systems-architect
        description: 'Assess feasibility.'
      -
        key: rejected
        name: Rejected
        type: transitional
        roles:
          - solutions-architect
        description: 'The solution proposal was rejected.'
      -
        key: approved
        name: Approved
        type: transitional
        roles:
          - product-owner
        description: 'The solution proposal was approved.'
      -
        key: ready
        name: Ready
        type: final
        roles: {}
        description: 'Ready for downstream.'
      -
        key: canceled
        name: Canceled
        type: final
        roles: {}
    transitions:
      -
        name: cancel
        from: any
        to: canceled
        actor: user
      -
        name: discover
        from: conceptualizing
        to: discovering
        actor: system
      -
        name: design
        from: discovering
        to: designing
        actor: system
      -
        name: assess
        from: designing
        to: assessing
        actor: system
      -
        name: reject
        from: assessing
        to: rejected
        actor: system
      -
        name: approve
        from: assessing
        to: approved
        actor: system
      -
        name: retry
        from: rejected
        to: designing
        actor: user
      -
        name: finish
        from: approved
        to: ready
        actor: system
  -
    key: story-workflow
    name: 'Story Workflow'
    issue_types:
      -
        key: story
        name: Story
        level: 1
      -
        key: bug
        name: Bug
        level: 1
    statuses:
      -
        key: prioritizing
        name: Prioritizing
        type: initial
        roles:
          - product-owner
        description: 'Prioritize based on RICE.'
      -
        key: evaluating
        name: Evaluating
        type: transitional
        roles:
          - technical-architect
        description: 'Define stacks and tools and break the story into atomic subtasks.'
      -
        key: developing
        name: Developing
        type: transitional
        roles: {}
        description: 'Waiting for subtasks to be ready and merged.'
      -
        key: testing
        name: Testing
        type: transitional
        roles:
          - quality-assurance
        description: 'Test and create a fix subtask when there are problems.'
      -
        key: deploying
        name: Deploying
        type: transitional
        roles:
          - tech-lead
        description: 'Deploy to production.'
      -
        key: verifying
        name: Verifying
        type: transitional
        roles:
          - quality-assurance
        description: 'Run functional, regression and post-deploy smoke tests.'
      -
        key: reverting
        name: Reverting
        type: transitional
        roles:
          - tech-lead
        description: 'Roll back the deployment.'
      -
        key: reverted
        name: Reverted
        type: transitional
        roles: {}
        description: 'Reverted, waiting for a manual user retry.'
