name: Debug containers
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  list:
    if: github.head_ref == 'debug/containers'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - run: npm ci
        working-directory: deploy/cloudflare
      - name: List containers
        run: npx wrangler containers list
        working-directory: deploy/cloudflare
      - name: Container info
        run: npx wrangler containers info 3e687f9c2b1040f9b2fe70ba56f44b98
        working-directory: deploy/cloudflare
      - name: Container instances
        run: npx wrangler containers instances 3e687f9c2b1040f9b2fe70ba56f44b98
        working-directory: deploy/cloudflare
