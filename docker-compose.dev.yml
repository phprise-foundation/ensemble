services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: phprise
      POSTGRES_USER: phprise
      POSTGRES_PASSWORD: phprise
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phprise -d phprise"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
