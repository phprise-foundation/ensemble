x-agent: &agent
  image: esdrasschonevald/agent-watcher:latest
  build:
    context: ../agent-watcher
  restart: unless-stopped
  depends_on:
    - board
  profiles: ["agents"]
  volumes:
    - ${AW_WORKSPACE:-./workspace}:/workspace

services:
  board:
    build: .
    ports:
      - "${BOARD_PORT:-8080}:80"
    environment:
      BOARD_PASSWORD: ${BOARD_PASSWORD:-admin}
      BOARD_DB_FILE: /var/www/html/var/board.sqlite
      CHAT_URL: ${CHAT_URL:-}
      CHAT_TOKEN: ${CHAT_TOKEN:-}
      CHAT_TIMEOUT: ${CHAT_TIMEOUT:-120}
    volumes:
      - board-data:/var/www/html/var

  runner:
    <<: *agent
    entrypoint: ["agent-runner"]
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AW_BACKEND: local
      AW_KANBAN_URL: http://board
      AW_KANBAN_TOKEN: ${BOARD_PASSWORD:-admin}
      AW_RUNNER_POLL: ${AW_RUNNER_POLL:-30}

  chat:
    image: esdrasschonevald/agent-watcher:latest
    build:
      context: ../agent-watcher
    restart: unless-stopped
    depends_on:
      - board
    profiles: ["chat"]
    entrypoint: ["chat-server"]
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AW_BACKEND: local
      AW_KANBAN_URL: http://board
      AW_KANBAN_TOKEN: ${BOARD_PASSWORD:-admin}
      AW_CHAT_TOKEN: ${CHAT_TOKEN:-changeme}
      AW_MODEL: ${AW_MODEL:-deepseek/deepseek-v4-pro}
      AW_WORKDIR: /workspace
    volumes:
      - ${AW_WORKSPACE:-./workspace}:/workspace

volumes:
  board-data:
